name: merge-pr-on-issue-approval
on:
  issues:
    types:
      - labeled
jobs:
  merge-pr:
    if: ${{ github.event.label.name == 'approved' }}
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: merge-pr
        run: |
          pr_url=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/Duet3D/PluginRepository/pulls?per_page=100" \
          | jq -r --arg prefix "[$GITHUB_ISSUE]" '[.[] | select(.title | startswith($prefix))] | first | .url // empty')

          echo "Pull request: ${pr_url:-none}"

          if [ -z "$pr_url" ]; then
            curl -s -X POST -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/Duet3D/PluginRepository/issues/$GITHUB_ISSUE/comments -d '{"body":"No open pull request found for this issue, so there is nothing to merge. Close and reopen the issue to run the checks and create the pull request again."}'
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            curl -s -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" "$pr_url/merge" > merge_response.json
            cat merge_response.json | jq
            if [ "$(jq -r '.merged' merge_response.json)" = true ]; then break; fi
            echo "Merge attempt $attempt failed, another submission may have moved master"
            sleep 15
          done

          if [ "$(jq -r '.merged' merge_response.json)" != true ]; then
            curl -s -X POST -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/Duet3D/PluginRepository/issues/$GITHUB_ISSUE/comments -d "$(jq -n --arg msg "$(jq -r '.message // "unknown error"' merge_response.json)" '{body: "Merging the pull request failed: \($msg)"}')"
            exit 1
          fi

          curl -s -X POST -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/Duet3D/PluginRepository/issues/$GITHUB_ISSUE/labels -d '{"labels":["merged"]}'
          curl -s -X PATCH -H "Accept: application/vnd.github+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/Duet3D/PluginRepository/issues/$GITHUB_ISSUE -d '{"state":"closed"}'
  update-version:
    needs: merge-pr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: update-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull


          cp package.json nodescriptsTS/src/
          cd nodescriptsTS
          npm install
          cd src
          npx ts-node updateVersion.ts

          cd ../../
          rm package.json
          cp nodescriptsTS/src/package.json package.json

          git add package.json
          git commit -m "Update version"

          for attempt in 1 2 3 4 5; do
            if git push origin master; then exit 0; fi
            git pull --rebase --autostash origin master
          done
          exit 1

  deploy-gh-pages:
    needs: update-version
    runs-on: ubuntu-24.04
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          set -e

          git pull

          npm install
          npm run build

          cp CNAME src/.vuepress/dist
          cp plugin_stats.json src/.vuepress/dist/assets
          cp -r plugin_versions src/.vuepress/dist/assets
          cp author_stats.json src/.vuepress/dist/assets

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/.vuepress/dist
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
